name: Build GHST 2

on:
  push:
    paths:
      - 'GHST2/**'
      - '.github/workflows/build-ghst2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Gradle 2.14.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build Forge 1.8.9 mod
        run: gradle -p GHST2 build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MevdZGHSTBeta-GHST2
          path: GHST2/build/libs/*.jar
